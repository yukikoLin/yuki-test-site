<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="小雪與青梧的第一個 GitHub Pages 實驗網站">
  <title>小糰兔的療癒角落</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="sparkle sparkle-one">✦</div>
    <div class="sparkle sparkle-two">✧</div>

    <section class="copy">
      <p class="eyebrow">YUKI'S FIRST GITHUB PAGE</p>
      <h1>今天也要<br><span>軟綿綿地生活</span></h1>
      <p class="intro">這是小雪與青梧一起放上 GitHub 的第一個網頁。每按一次，小糰兔就送你一點療癒能量。</p>
      <button id="energyButton" type="button">接收兔兔能量 <span>♡</span></button>
      <p id="message" class="message" aria-live="polite">目前能量：安靜待機中</p>
    </section>

    <section class="scene" aria-label="戴著紅領巾的奶油白小兔插畫">
      <div class="halo"></div>
      <div class="bunny" id="bunny">
        <div class="ear ear-left"><i></i></div>
        <div class="ear ear-right"><i></i></div>
        <div class="head">
          <span class="eye eye-left"></span>
          <span class="eye eye-right"></span>
          <span class="nose"></span>
          <span class="cheek cheek-left"></span>
          <span class="cheek cheek-right"></span>
        </div>
        <div class="scarf"></div>
        <div class="body">
          <span class="paw paw-left"></span>
          <span class="paw paw-right"></span>
        </div>
      </div>
      <div class="shadow"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
